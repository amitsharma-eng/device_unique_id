name: device_unique_id
description: Get a reliable device identifier on Android and iOS — Android ID, iOS identifierForVendor, and a Keychain/EncryptedSharedPreferences-backed persistent UUID that survives reinstall.
version: 1.0.0
homepage: https://github.com/amitsharma-eng/device_unique_id
repository: https://github.com/amitsharma-eng/device_unique_id
topics:
  - device
  - device-id
  - unique-id
  - platform-channel

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.amitsharma.device_unique_id
        pluginClass: DeviceUniqueIdPlugin
      ios:
        pluginClass: DeviceUniqueIdPlugin
